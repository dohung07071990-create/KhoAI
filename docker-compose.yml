services:
  khoai:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/khoai.sqlite3
      KHOAI_ZONE_FILE: /app/data/zone.json
      KHOAI_YOLO_MODEL: /app/data/yolov8n.pt
    volumes:
      - khoai_data:/app/data
    restart: unless-stopped
volumes:
  khoai_data:
